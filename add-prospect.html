<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Prospect — ZENTRA Reach</title>
<link rel="stylesheet" href="assets/zentra.css">
<link rel="stylesheet" href="assets/reach.css">
<script src="assets/theme-boot.js"></script>
<style>
/* ---- CSS variable fallbacks for reach.css ---- */
:root {
  --card: var(--navy-panel, #12283f);
  --line: var(--hairline-soft, rgba(201,162,39,0.28));
  --radius: var(--r-md, 14px);
  --radius-sm: 6px;
  --ink: var(--text-primary, #ffffff);
  --ink-2: var(--text-body, #c7d1dc);
  --ink-3: var(--text-muted, #8c9fb4);
  --page-bg: var(--primary, #0b1b2e);
  --gold-core: #c9a227;
}
:root.theme-light {
  --card: #ffffff;
  --line: #e2e8f0;
  --radius: 14px;
  --ink: #16222f;
  --ink-2: #3a4555;
  --ink-3: #8c9fb4;
  --page-bg: #f5f7f9;
}
html { background: var(--page-bg); }

/* ---- Reach app header ---- */
.reach-header {
  background: rgba(7,17,32,0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--hairline-soft);
  position: sticky;
  top: 0;
  z-index: 50;
}
.reach-header-inner {
  max-width: var(--wrap, 1120px);
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  min-height: 64px;
  gap: 24px;
}
.reach-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-right: auto;
}
.reach-brand img { width: 30px; height: 30px; }
.reach-brand b {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: var(--text-primary);
}
.reach-brand span {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.14em;
  background: var(--grad-gold);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.reach-nav {
  display: flex;
  align-items: center;
  gap: 6px;
}
.reach-nav a {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: var(--r-sm, 10px);
  transition: all 0.18s ease;
  white-space: nowrap;
}
.reach-nav a:hover {
  color: var(--text-primary);
  background: rgba(255,255,255,0.05);
}
.reach-nav a[aria-current="page"] {
  color: var(--gold-core);
  font-weight: 700;
  background: rgba(201,162,39,0.10);
}
@media (max-width: 800px) {
  .reach-nav { display: none; }
}

/* ---- Page layout ---- */
.page-wrap {
  max-width: var(--wrap, 1120px);
  margin: 0 auto;
  padding: 28px 24px 64px;
}

/* ---- Mobile menu toggle ---- */
.mobile-nav-toggle {
  display: none;
  background: none;
  border: 1px solid var(--hairline-soft);
  color: var(--text-body);
  width: 38px;
  height: 38px;
  border-radius: 8px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}
@media (max-width: 800px) {
  .mobile-nav-toggle { display: flex; }
}

/* ---- Footer ---- */
.reach-footer {
  border-top: 1px solid var(--hairline-soft);
  padding: 24px 0;
  background: var(--navy-deep);
}
.reach-footer-inner {
  max-width: var(--wrap, 1120px);
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
}
@media (max-width: 600px) {
  .reach-footer-inner { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="reach-header">
  <div class="reach-header-inner">
    <a href="index.html" class="reach-brand">
      <img src="assets/reach-mark.png" alt="ZENTRA Reach">
      <b>ZENTRA</b> <span>Reach</span>
    </a>
    <nav class="reach-nav">
      <a href="index.html">Dashboard</a>
      <a href="prospects.html">Prospects</a>
      <a href="campaigns.html">Campaigns</a>
      <a href="add-prospect.html" aria-current="page">Add Prospect</a>
      <a href="campaign-builder.html">Campaign Builder</a>
      <a href="sources.html">Sources</a>
      <a href="settings.html">Settings</a>
    </nav>
    <button class="mobile-nav-toggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<!-- ===== PAGE CONTENT ===== -->
<main class="page-wrap">

  <div class="section-header">
    <h2>Add New Prospect</h2>
  </div>

  <div class="sec-card">
    <form class="form-grid" onsubmit="return false;">

      <!-- Row 1: First Name, Last Name -->
      <div class="fg">
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="fname" placeholder="e.g. Ahmad" required>
      </div>
      <div class="fg">
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lname" placeholder="e.g. bin Ismail">
      </div>

      <!-- Row 2: Job Title, Company -->
      <div class="fg">
        <label for="job">Job Title</label>
        <input type="text" id="job" name="job" placeholder="e.g. Head of Procurement">
      </div>
      <div class="fg">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" placeholder="e.g. MMC Logistics Sdn Bhd">
      </div>

      <!-- Row 3: Email, Phone -->
      <div class="fg">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ahmad@company.com" required>
      </div>
      <div class="fg">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="+60 12-345 6789">
      </div>

      <!-- Row 4: LinkedIn URL, Website -->
      <div class="fg">
        <label for="linkedin">LinkedIn URL</label>
        <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/...">
      </div>
      <div class="fg">
        <label for="website">Website</label>
        <input type="url" id="website" name="website" placeholder="https://company.com.my">
      </div>

      <!-- Row 5: Industry, Source -->
      <div class="fg">
        <label for="industry">Industry</label>
        <select id="industry" name="industry">
          <option value="">Select industry&hellip;</option>
          <option>Manufacturing</option>
          <option>Logistics</option>
          <option>F&amp;B</option>
          <option>Retail</option>
          <option>Tech</option>
          <option>Healthcare</option>
          <option>Other</option>
        </select>
      </div>
      <div class="fg">
        <label for="source">Source</label>
        <select id="source" name="source">
          <option value="">Select source&hellip;</option>
          <option>LinkedIn</option>
          <option>Google Dorks</option>
          <option>FMM Directory</option>
          <option>SSM e-Info</option>
          <option>Referral</option>
          <option>Event</option>
          <option>Cold Call</option>
          <option>Other</option>
        </select>
      </div>

      <!-- Row 6: Status, Priority -->
      <div class="fg">
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="">Select status&hellip;</option>
          <option>New</option>
          <option>Warm</option>
          <option>Cold</option>
          <option>Contacted</option>
          <option>Meeting</option>
        </select>
      </div>
      <div class="fg">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          <option value="">Select priority&hellip;</option>
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
      </div>

      <!-- Row 7: Notes (full width) -->
      <div class="fg fg-full">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" placeholder="Any notes about this prospect&hellip;"></textarea>
      </div>

      <!-- Row 8: Tags (full width) -->
      <div class="fg fg-full">
        <label for="tags">Tags</label>
        <input type="text" id="tags" name="tags" placeholder="comma separated e.g. industrial, johor, warm-lead">
      </div>

    </form>

    <div class="form-actions">
      <a href="prospects.html" class="btn-ghost">Cancel</a>
      <button type="submit" class="btn-gold" onclick="this.closest('form').requestSubmit();">&#x1F4BE; Save Prospect</button>
    </div>
  </div>

</main>

<!-- ===== FOOTER ===== -->
<footer class="reach-footer">
  <div class="reach-footer-inner">
    <span>&copy; 2026 ZENTRA Reach &mdash; B2B CRM for Real Estate</span>
    <span class="micro">Prototype &middot; sample data</span>
  </div>
</footer>

<script src="assets/ui.js"></script>
</body>
</html>
